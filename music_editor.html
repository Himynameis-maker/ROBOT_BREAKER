<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robot Breaker - ファミコン自動作曲ツール</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: #080d1a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      touch-action: manipulation;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 8px; }
    .card {
      background: #11192e; border: 1px solid #263455;
      border-radius: 10px; padding: 8px 10px; margin-bottom: 8px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .row + .row { margin-top: 6px; }
    h1 { margin: 0; font-size: 15px; color: #38bdf8; letter-spacing: 0.4px; }
    .muted { color: #94a3b8; font-size: 12px; }
    button, select, input[type="text"] {
      background: #1b2644; color: #f1f5f9;
      border: 1px solid #354772; border-radius: 7px;
      padding: 6px 9px; font-size: 13px;
      touch-action: manipulation;
    }
    select, input[type="text"], textarea { font-size: 16px; }
    button { cursor: pointer; font-weight: 600; user-select: none; -webkit-user-select: none; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #0284c7; border-color: #38bdf8; color: #fff; }
    button.play-btn { background: #15803d; border-color: #4ade80; color: #fff; }
    button.stop-btn { background: #991b1b; border-color: #f87171; color: #fff; }
    button.active { background: #ea580c; border-color: #fb923c; color: #fff; }
    .badge {
      background: #1e293b; border: 1px solid #38bdf8; color: #7dd3fc;
      border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700;
    }
    .sec-box {
      display: flex; align-items: center; gap: 4px;
      background: #0b1122; border: 1px solid #263455;
      border-radius: 8px; padding: 3px 6px;
    }
    .sec-tab { padding: 5px 10px; }
    .mini-btn { padding: 4px 8px; font-size: 12px; }
    .bar-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .bar-pill { padding: 4px 7px; font-size: 11px; border-radius: 6px; }
    .bar-pill.active { background: #0284c7; border-color: #38bdf8; }
    .bar-pill.playing { box-shadow: 0 0 0 2px #4ade80; }
    .chord-picker {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin-top: 6px; padding-top: 6px; border-top: 1px solid #263455;
    }
    .chord-picker.hidden { display: none; }
    .chord-choice { padding: 5px 9px; font-size: 12px; }
    .chord-choice.selected { background: #0284c7; border-color: #38bdf8; }

    /* ピアノロール */
    .piano-scroll {
      height: 360px; overflow: auto;
      border: 1px solid #2d3e66; border-radius: 8px;
      background: #070b15;
      -webkit-overflow-scrolling: touch;
    }
    .piano-grid { width: 100%; display: flex; flex-direction: column; }
    .piano-grid.zoomed { width: 560px; }
    .pr-row { display: flex; align-items: stretch; border-bottom: 1px solid #151e34; }
    .pr-row.c-row { border-bottom: 1px solid #38bdf855; }
    .pr-row.black-row { background: #0b1020; }
    .pr-head { position: sticky; top: 0; z-index: 4; background: #131c34; border-bottom: 2px solid #354772; }
    .pr-key {
      position: sticky; left: 0; z-index: 3;
      flex: 0 0 48px; width: 48px;
      padding: 0 3px; height: 26px; line-height: 26px;
      font-size: 10px; font-weight: 700; text-align: left;
      border: none; border-right: 2px solid #354772; border-radius: 0;
      background: #e2e8f0; color: #0f172a;
      overflow: hidden; white-space: nowrap;
    }
    .pr-key.black { background: #1e293b; color: #94a3b8; }
    .pr-key.c-key { background: #bae6fd; color: #0c4a6e; }
    .pr-corner { background: #131c34; color: #7dd3fc; text-align: center; z-index: 5; }
    .pr-step-num {
      flex: 1 1 0; min-width: 19px; height: 24px; line-height: 24px;
      text-align: center; font-size: 11px; color: #64748b;
      border-right: 1px solid #1f2b49;
    }
    .pr-step-num.beat { color: #38bdf8; font-weight: 700; border-left: 1px solid #475569; }
    .pr-step-num.playing { background: #14532d; color: #4ade80; }
    .pr-cell {
      flex: 1 1 0; min-width: 19px; height: 26px;
      padding: 0; border: none; border-right: 1px solid #17213b; border-radius: 0;
      background: transparent; color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .pr-cell.beat-start { border-left: 1px solid #3b4f7a; }
    .pr-cell.playing { background: rgba(74, 222, 128, 0.16); }
    .pr-cell.note-start { background: #f97316; color: #fff; box-shadow: inset 0 0 0 1px #ffedd5; }
    .pr-cell.note-hold { background: #c2410c; color: #fed7aa; }
    .pr-cell.note-start.playing, .pr-cell.note-hold.playing { background: #4ade80; color: #052e16; }
    .empty-notice { padding: 40px 16px; text-align: center; color: #94a3b8; }

    .ch-label {
      display: inline-flex; align-items: center; gap: 4px;
      background: #1b2644; border: 1px solid #354772;
      border-radius: 7px; padding: 4px 8px; font-size: 12px;
    }
    textarea {
      width: 100%; min-height: 54px; margin-top: 6px;
      background: #070b15; color: #cbd5e1;
      border: 1px solid #354772; border-radius: 7px;
      padding: 6px; font-family: monospace;
    }
    #statusMsg { color: #4ade80; font-size: 12px; min-height: 16px; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h1>🎵 Robot Breaker ファミコン自動作曲</h1>
      <span id="keyBadge" class="badge">判定キー: --</span>
    </div>
    <div class="row">
      <select id="slotSelect" style="flex:1; min-width:130px;"></select>
      <input id="songName" type="text" placeholder="曲名" style="flex:1; min-width:110px;">
      <button id="btnSaveSlot" type="button" class="primary mini-btn">保存</button>
    </div>
    <div class="row">
      <select id="presetSelect" style="flex:1;"></select>
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btnPlayAll" type="button" class="play-btn">▶ 通し再生</button>
      <button id="btnPlayIntro" type="button" class="play-btn mini-btn">▶ イントロ</button>
      <button id="btnPlayLoop" type="button" class="play-btn mini-btn">▶ ループ</button>
      <button id="btnStop" type="button" class="stop-btn">■ 停止</button>
      <label class="ch-label"><input id="chkFollow" type="checkbox" checked> 追従</label>
    </div>
    <div class="row">
      <div class="sec-box">
        <button id="tabIntro" type="button" class="sec-tab">イントロ (2)</button>
        <button id="introBarsMinus" type="button" class="mini-btn">－</button>
        <span id="introBarsVal" class="muted">2小節</span>
        <button id="introBarsPlus" type="button" class="mini-btn">＋</button>
      </div>
      <div class="sec-box">
        <button id="tabLoop" type="button" class="sec-tab active">ループ (4)</button>
        <button id="loopBarsMinus" type="button" class="mini-btn">－</button>
        <span id="loopBarsVal" class="muted">4小節</span>
        <button id="loopBarsPlus" type="button" class="mini-btn">＋</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <select id="styleSelect" style="flex:1; min-width:160px;"></select>
      <select id="modeSelect">
        <option value="auto">調: 自動</option>
        <option value="major">調: 明るい(長調)</option>
        <option value="minor">調: クール(短調)</option>
      </select>
    </div>
    <div class="row">
      <span id="bpmVal" style="min-width:68px; font-weight:700;">138 BPM</span>
      <input id="bpmRange" type="range" min="60" max="220" step="1" value="138" style="flex:1;">
    </div>
    <div class="row">
      <label class="ch-label"><input type="checkbox" data-ch="melody" checked> ♪ メロディ</label>
      <label class="ch-label"><input type="checkbox" data-ch="arp" checked> ✨ 伴奏</label>
      <label class="ch-label"><input type="checkbox" data-ch="bass" checked> 🎸 ベース</label>
      <label class="ch-label"><input type="checkbox" data-ch="drums" checked> 🥁 ドラム</label>
      <label class="ch-label"><input id="chkSlow" type="checkbox"> 🐢 0.6x減速</label>
      <label class="ch-label"><input id="chkBoost" type="checkbox"> 🚀 靴ブースト</label>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="row">
        <button id="btnToolDraw" type="button" class="active">■ 置く/消す</button>
        <button id="btnToolHold" type="button">━ のばす</button>
        <button id="btnUndo" type="button" class="mini-btn">↩ もどす</button>
      </div>
      <div class="row">
        <label class="ch-label"><input id="chkZoom" type="checkbox"> 🔍 拡大</label>
        <button id="btnOctUp" type="button" class="mini-btn">1Oct↑</button>
        <button id="btnOctDown" type="button" class="mini-btn">1Oct↓</button>
      </div>
    </div>
    <div class="row" style="justify-content:space-between;">
      <div class="row">
        <button id="barPrev" type="button" class="mini-btn">◀</button>
        <span id="barLabel" style="font-weight:700;">1 / 4 小節目</span>
        <button id="barNext" type="button" class="mini-btn">▶</button>
        <button id="chordBtn" type="button" class="primary mini-btn">自動コード: Am ▼</button>
      </div>
      <div class="row">
        <button id="btnCopyBar" type="button" class="mini-btn">コピー</button>
        <button id="btnPasteBar" type="button" class="mini-btn">貼付</button>
        <button id="btnClearBar" type="button" class="mini-btn">小節消去</button>
      </div>
    </div>
    <div id="chordPicker" class="chord-picker hidden"></div>
    <div class="row" style="margin-top:6px;">
      <div id="barTabs" class="bar-tabs"></div>
    </div>

    <div id="pianoScroll" class="piano-scroll" style="margin-top:6px;">
      <div id="pianoGrid" class="piano-grid"></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btnExport" type="button" class="mini-btn">1行データ出力</button>
      <button id="btnCopyExport" type="button" class="primary mini-btn">コピー</button>
      <button id="btnImport" type="button" class="mini-btn">枠から読込</button>
      <span class="muted">（将来ゲーム本編へ組み込む用のデータ）</span>
    </div>
    <textarea id="exportBox" placeholder="「1行データ出力」を押すとここに曲データが出ます"></textarea>
  </div>

</div>
<script src="src/sound_engine.js"></script>
<script src="src/music_editor.js"></script>
</body>
</html>
